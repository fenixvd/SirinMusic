name: Android CI
on:
  push:
    branches: [master, dev]
    tags: ['1.5-dev']
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIRIN_VERSION_NAME: 2.0rc0.2-dev
      SIRIN_VERSION_CODE: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-environment
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: APK for testing
        uses: actions/upload-artifact@v7
        with:
          name: sirin-music-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  dev-apk:
    if: github.repository == 'fenixvd/SirinMusic' && github.event_name == 'push' && (github.ref == 'refs/tags/1.5-dev' || github.ref == 'refs/heads/dev')
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIRIN_VERSION_NAME: 2.0rc0.2-dev
      SIRIN_VERSION_CODE: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-environment
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIRIN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIRIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIRIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIRIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo 'Configure all four SIRIN signing secrets before publishing'; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sirin-release.jks"
      - name: Verify and build signed APK
        env:
          SIRIN_KEYSTORE_PATH: ${{ runner.temp }}/sirin-release.jks
          SIRIN_KEYSTORE_PASSWORD: ${{ secrets.SIRIN_KEYSTORE_PASSWORD }}
          SIRIN_KEY_ALIAS: ${{ secrets.SIRIN_KEY_ALIAS }}
          SIRIN_KEY_PASSWORD: ${{ secrets.SIRIN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
      - name: Verify signature and prepare dev files
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dev-files
          cp "$apk" "dev-files/SirinMusic-${SIRIN_VERSION_NAME}.apk"
          (cd dev-files && sha256sum ./*.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: sirin-music-2.0rc0.2-dev
          path: dev-files/
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sirin-release.jks"
